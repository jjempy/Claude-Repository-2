version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: leanshop_rca
      POSTGRES_USER: leanshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leanshop_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leanshop -d leanshop_rca"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://leanshop:${POSTGRES_PASSWORD:-leanshop_secret}@postgres:5432/leanshop_rca
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_change_in_production}
      PORT: 4000
      UPLOAD_DIR: /uploads
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - uploads_data:/uploads
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
